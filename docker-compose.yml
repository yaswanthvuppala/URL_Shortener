version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - BASE_URL=http://localhost:8000
      - DATABASE_URL=sqlite:///./data/url_shortener.db
      - REDIS_URL=redis://redis:6379
    volumes:
      - app-data:/app/data
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: always

volumes:
  app-data:
